[project]
name = "koto"
version = "0.1.0"
description = "Todo manager with TUI and mobile web interface"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.1",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "platformdirs>=4.10.0",
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0.50",
    "textual>=8.2.7",
    "uvicorn[standard]>=0.48.0",
    "websockets>=16.0",
]

[project.scripts]
koto = "koto.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
